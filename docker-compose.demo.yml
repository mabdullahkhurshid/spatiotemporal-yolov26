# Demo cameras only (mediamtx + fakecam), for running the app itself on the host with `npm run dev`.
#   npm run demo:up     start once; restart: unless-stopped brings them back whenever Docker starts
#   npm run demo:down   stop and remove
# Every demo_videos/<name>.mp4 loops forever at rtsp://localhost:8554/demo/<name>.
# Use docker-compose.yml instead when the backend runs in Docker too (it starts these services itself).
name: fire-detection-demo

services:
  # Stream server: RTSP for the backend and inference, WebRTC (WHIP) for browser webcams.
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    environment:
      # Publish/read checks go to the backend on the host (overrides authHTTPAddress in mediamtx.yml).
      - MTX_AUTHHTTPADDRESS=http://host.docker.internal:${PORT:-5000}/api/internal/mediamtx/auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  fakecam:
    build: ./infra/fakecam
    restart: unless-stopped
    init: true
    environment:
      - RTSP_BASE=rtsp://mediamtx:8554
      - MEDIAMTX_INTERNAL_USER=${MEDIAMTX_INTERNAL_USER:-internal}
      - MEDIAMTX_INTERNAL_PASS=${MEDIAMTX_INTERNAL_PASS:?Set MEDIAMTX_INTERNAL_PASS in .env (see .env.example)}
    volumes:
      - ./demo_videos:/media:ro
    depends_on:
      - mediamtx
