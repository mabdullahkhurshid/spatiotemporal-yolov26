version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: fire-detection-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fire-detection-system

  backend:
    build: .
    container_name: fire-detection-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/fire-detection-system
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app/backend
      - /app/node_modules

volumes:
  mongodb_data:
