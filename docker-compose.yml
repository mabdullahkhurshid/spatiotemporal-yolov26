version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: fire-detection-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fire-detection-system

  backend:
    build: .
    container_name: fire-detection-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/fire-detection-system
      - PORT=5000
      - INFERENCE_SERVICE_API_KEY=${INFERENCE_SERVICE_API_KEY:-change-me-inference-key}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - /app/node_modules

  inference:
    build: ./python-services/inference
    container_name: fire-detection-inference
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5000
      - INFERENCE_SERVICE_API_KEY=${INFERENCE_SERVICE_API_KEY:-change-me-inference-key}
      - INFERENCE_MODEL_PATH=/app/weights/best.onnx
      - INFERENCE_FRAME_INTERVAL_MS=500
      - INFERENCE_MAX_CONCURRENT_CAMERAS=4
    depends_on:
      - backend
    volumes:
      - ./python-services/inference/weights:/app/weights:ro

volumes:
  mongodb_data:
